# Runtime-floor smoke check.
#
# slothlet has two Node floors: `engines.node` (what consumers may run) and
# `devEngines` (what vitest and the build toolchain need). The CI matrix in
# ci.yml starts at the dev floor, so the versions between the two floors are
# never exercised there. This workflow installs and builds on the dev floor,
# then switches to the runtime floor and runs tests/smoke/runtime-floor.mjs,
# a plain-Node script with no dev toolchain at run time, against src, against
# the built dist, and once with AsyncContextFrame on as a canary.
#
# Keep RUNTIME_FLOOR in step with `engines.node` and DEV_FLOOR with
# `devEngines.runtime.version` in package.json.
name: 🧱 Runtime Floor

on:
    push:
        branches: [master, main, next, hotfixes]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches: [master, main, next, hotfixes]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: runtime-floor-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    DEV_FLOOR: "22.22.0"
    RUNTIME_FLOOR: "22.15.0"

jobs:
    runtime-floor:
        name: Runtime floor smoke (Node 22.15.0)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Node (dev floor) for install and build
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.DEV_FLOOR }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build dist
              run: npm run build

            - name: Set up Node (runtime floor)
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.RUNTIME_FLOOR }}

            - name: Confirm runtime floor
              run: |
                  node --version
                  test "$(node --version)" = "v${RUNTIME_FLOOR}"

            # Plain `node`, not `npm run test:runtime-floor`: npm enforces
            # devEngines (onFail: error) on `npm run`, so it refuses to run
            # scripts below the dev floor.
            - name: Smoke against src
              run: node --conditions=slothlet-dev tests/smoke/runtime-floor.mjs

            - name: Smoke against dist
              run: node tests/smoke/runtime-floor.mjs

            - name: Smoke against dist with AsyncContextFrame on (canary)
              env:
                  NODE_OPTIONS: --experimental-async-context-frame
              run: node tests/smoke/runtime-floor.mjs
