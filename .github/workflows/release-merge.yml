# v4 core (opt-in): squash-merge the persistent `next → master` release PR on
# MY APPROVAL, via the REST merge API with the PR body as the commit message.
#
# Why not just click "Squash and merge"? The mobile Default path can land a
# title-only commit (dropping the curated changelog + coverage), and the web/
# mobile squash UI auto-appends its own `Co-authored-by:` list (not deduped, not
# bot-stripped). An explicit-message API merge avoids both — the release commit
# is exactly the curated PR body. It also merges only once EVERY check (required
# AND non-required — e.g. the coverage badge and the release-PR body refresh)
# has finished and passed, so the body it captures is never stale.
#
# Usage: approve the release PR as normal. The merge fires when CI is green — if
# the approval precedes green, it re-evaluates once CI actually finishes and
# merges once the last check passes. Nothing merges without the approval.
#
# Re-evaluation uses `workflow_run`, not `check_suite` — GitHub does not send
# `check_suite: completed` for a suite created by GitHub Actions itself, which
# is every check this repo's own ci.yml produces; it only fires for a suite
# created by a third-party App. PR #437 sat fully green and approved for 20+
# minutes with zero check_suite-triggered runs of this workflow at all
# (CLDMV/.github#318) — check_suite was silently dead for exactly the case it
# exists to handle. `workflow_run` is GitHub's documented replacement for this
# pattern and doesn't have that restriction.
#
# Thin caller: all logic lives in the reusable, pinned at @v4.
# NOTE: pull_request_review / workflow_run events run the copy of this file on
# the DEFAULT branch, so it takes effect once it ships to master with a release
# (and once workflow-release-merge.yml is present in CLDMV/.github@v4).
name: 🚦 Release Merge (v4)

on:
    pull_request_review:
        types: [submitted] # approval arms it
    workflow_run:
        # Must match this repo's own ci.yml `name:` exactly (workflow_run
        # matches by literal workflow name, not filename) — update both if
        # ci.yml is ever renamed. See CLDMV/.github#318.
        workflows: ["🧪 CI Tests & Build"]
        types: [completed]
    workflow_dispatch: # manual re-evaluation

# Serialize per repo: each run re-resolves the release PR + re-gates the head,
# so queue (don't cancel) to avoid racing a merge that's already in flight.
concurrency:
    group: release-merge-${{ github.repository }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    merge:
        permissions:
            contents: write
            pull-requests: write
            checks: read
            statuses: read
        uses: CLDMV/.github/.github/workflows/workflow-release-merge.yml@v4
        secrets:
            BOT_APP_CLIENT_ID: ${{ secrets.CLDMV_BOT_APP_CLIENT_ID }}
            BOT_APP_PRIVATE_KEY: ${{ secrets.CLDMV_BOT_APP_PRIVATE_KEY }}
